[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-tts"
version = "0.2.0"
description = "The natural-voice sidecar for Flash: text in, an MP4/AAC clip and a loudness envelope out."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    # The engine and its grapheme-to-phoneme front ends. Install torch first
    # from the CPU index (see README.md); a plain `pip install` of this
    # package would otherwise pull the CUDA build, a gigabyte of wheels
    # nothing here uses.
    "torch>=2.2",
    "kokoro>=0.9.4,<0.10",
    "misaki[en,zh]>=0.9.4,<0.10",
    # Japanese, spelled out instead of `misaki[ja]`: that extra pulls the
    # full `unidic`, whose dictionary is a separate half-gigabyte download
    # and which, merely installed, makes the tokenizer look for it and
    # fail. `unidic-lite` ships its dictionary in the wheel and is picked
    # up automatically when `unidic` is absent.
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "jaconv>=0.3",
    "mojimoji>=0.0.12",
    "pyopenjtalk>=0.3.4",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["flash_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `python -m pytest tools/flash-tts/tests` finds the package from the
# repository root without installing it.
pythonpath = ["."]
