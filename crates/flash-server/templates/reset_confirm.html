{% extends "auth_base.html" %}
{% block title %}{{ "reset-new-title"|t }}{% endblock %}
{% block head %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<h1>{{ "reset-new-heading"|t }}</h1>
<p class="muted">{{ "reset-new-intro"|t }}</p>
<form class="fl-card fl-card-pad" method="post" action="/auth/reset/{{ token }}" style="display:flex;flex-direction:column;gap:12px">
  <div class="fl-field">
    <label class="fl-label" for="new-password">{{ "reset-new-password"|t }}</label>
    <input class="fl-input" type="password" id="new-password" name="password" required minlength="8" maxlength="512" autocomplete="new-password">
  </div>
  <div class="fl-field">
    <label class="fl-label" for="confirm-password">{{ "reset-new-confirm"|t }}</label>
    <input class="fl-input" type="password" id="confirm-password" name="confirm" required minlength="8" maxlength="512" autocomplete="new-password">
  </div>
  <button class="fl-btn fl-btn-primary" type="submit">{{ "reset-new-save"|t }}</button>
  {% if let Some(msg) = error %}<p class="error">{{ msg }}</p>{% endif %}
</form>
{% endblock %}
