{# The card's "more" menu on its corner: Edit and Archive, for the card
   on screen (static/study.js runs both). Archive takes the card out of
   study at once, no question asked; the Undo under the next card puts
   it back. #}
<details class="study-more">
  <summary class="study-more-btn" aria-label="{{ "study-more-label"|t }}" title="{{ "study-more-title"|t }}">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
  </summary>
  <div class="study-more-menu">
    <button type="button" class="study-more-item" data-study-edit-open>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      <span>{{ "study-edit-card"|t }}</span>
    </button>
    <button type="button" class="study-more-item" data-study-archive>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
      <span>{{ "study-archive-card"|t }}</span>
    </button>
  </div>
</details>
