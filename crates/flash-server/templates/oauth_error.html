{% extends "auth_base.html" %}
{% block title %}{{ "oauth-error-title"|t }}{% endblock %}
{% block content %}
<h1>{{ "oauth-error-heading"|t }}</h1>
<div class="fl-card fl-card-pad" style="text-align:start;display:flex;flex-direction:column;gap:12px">
  <p>{{ "oauth-error-body-html"|ta("code", code)|safe }}</p>
  <p class="fl-hint">{{ "oauth-error-hint"|t }}</p>
  <p><a class="fl-btn fl-btn-secondary" href="/" style="width:auto">{{ "oauth-error-back"|t }}</a></p>
</div>
{% endblock %}
