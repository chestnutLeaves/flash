{# The drafts of one note type, under the label the card editor gives
   it. Expects `group` in context. #}
<section class="gen-group">
  <h2>{{ group.label }} <span class="fl-badge">{{ group.rows.len() }}</span></h2>
  <table class="fl-table gen-table">
    <thead><tr><th>Front</th><th>Back</th><th>Tags</th><th></th></tr></thead>
    <tbody>
    {% for row in group.rows %}
    {% include "ai_draft_row.html" %}
    {% endfor %}
    </tbody>
  </table>
</section>
