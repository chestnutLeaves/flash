[package]
name = "flash-server"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
publish.workspace = true
repository.workspace = true
description = "Flash: a self-hosted spaced-repetition server you study with your AI over MCP"

[lints]
workspace = true

[features]
# The integration-test harness (`flash_server::testing`): builds the app
# the way production does with fakes swapped in. On for this crate's own
# tests and for a downstream crate's.
test-support = ["dep:tower", "dep:flash-scan", "dep:hyper", "dep:hyper-util", "tokio-util/io-util"]

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash"] }
askama = "0.16.0"
# The MCP transport's session store is an async trait (`mcp::DbSessions`).
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
intl-memoizer = "0.5.3"
unic-langid = "0.9.6"
# The disk's free space, so an export that would fill it is refused
# before it starts (statvfs / GetDiskFreeSpaceExW, no file locks).
fs4 = { version = "1.1.0", default-features = false }
hmac = "0.13.0"
http = "1.5.0"
jiff = "0.2.35"
# Every in-process lock. parking_lot has no poisoned state, so a panic
# while a guard is held costs that request and nothing after it.
parking_lot = "0.12"
rand = "0.10.2"
rmcp = { version = "3.5.1", features =["server", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
flash-core = { path = "../flash-core" }
flash-store = { path = "../flash-store" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal"] }
# `ReaderStream`: an export is built on disk and streamed from the file.
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5.3", optional = true }
# The source model the harness's route inventory is read from.
flash-scan = { path = "../flash-scan", optional = true }
# The harness serves the app over in-memory pipes (`testing::connect_in_memory`,
# `testing::memory_listener`): HTTP/1 with upgrades, no socket.
hyper = { version = "1.12", features = ["server", "client", "http1"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio", "service"], optional = true }
# `timeout`: no request lives forever. `catch-panic`: a panic anywhere
# in a request is a logged 500, never a dropped connection.
tower-http = { version = "0.7", features = ["timeout", "catch-panic"] }
tracing = "0.1.44"
# Redirect URIs are parsed, not prefix-matched (already linked via
# webauthn-rs).
url = "2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
# rustls on ring, verifying against the platform's own roots
# (`platform-verifier`): no C crypto library to build or keep patched.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
# The 0.6 line is pure Rust (RustCrypto underneath, no OpenSSL). Pinned
# exactly: it is a pre-release whose API may still move. Passkeys stored
# by 0.5 load and verify unchanged, and 0.5 reads what 0.6 writes, so a
# rollback strands nobody (tests/it/passkey_ceremony_tests.rs).
# `conditional-ui`: sign-in with discoverable credentials, so a challenge
# names no account. The proto crate (already under webauthn-rs) names
# the option types its prelude leaves out.
webauthn-rs = { version = "=0.6.1-dev", features = ["conditional-ui"] }
webauthn-rs-proto = "=0.6.1-dev"
# Numbers, dates, times and lists as each reader's region writes them: the
# Unicode CLDR, through ICU4X (pure Rust, Unicode-3.0). `sync` makes its
# data shareable across threads.
icu_decimal = "2.3"
icu_datetime = "2.3"
icu_calendar = "2.3"
fixed_decimal = "0.7.2"
icu_locale_core = "2.3"
icu_time = "2.3"
icu_list = "2.3"
writeable = "0.6.4"
icu_provider = { version = "2.3", features = ["sync"] }

[build-dependencies]
# build.rs reads the table of languages (flash-core's locale/registry.rs,
# included by path), whose rows derive Serialize.
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# The table of languages' plural rules held to CLDR's answers.
icu_plurals = "2.3"
# The crate's own tests use the harness through the feature.
flash-server = { path = ".", features = ["test-support"] }
parking_lot = "0.12"
flash-scan = { path = "../flash-scan" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.0"
# `test-util`: tests that run on a clock they advance (`start_paused`).
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
tower = "0.5.3"
zip = "9.0.4"
# The passkey ceremony tests: a software authenticator in the browser's
# place, and ring to sign for a passkey row written in an older format.
webauthn-authenticator-rs = { version = "=0.6.1-dev", default-features = false, features = ["softpasskey"] }
ring = "0.17"
