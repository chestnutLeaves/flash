# cargo-deny policy: known-vulnerable or unmaintained dependencies fail
# the build, every licence in the tree is one we accept, and crates come
# only from crates.io. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Advisories with no fix yet go here with the id and a reason, never
# silently.
ignore = [
    # Marvin, in `rsa` (no fixed release exists). It is a timing attack on
    # private-key operations. Here `rsa` only verifies passkey signatures
    # with public keys (webauthn-rs, via crypto-glue) and generates
    # throwaway keys in tests; every RSA signature the server makes goes
    # through ring. Mirrored in .github/workflows/audit.yml.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for public-key verification and test keys only; no private-key operation in production" },
    # basic-toml is unmaintained. askama_derive (0.16.1, the latest) reads
    # a crate's askama.toml with it, at build time only; it never runs in
    # the server. Drop this when askama moves off it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, through askama_derive's config feature; no newer askama yet" },
    # Timing variability in crypto-bigint 0.5 (fixed in 0.7.6). It reaches
    # us as webauthn-rs 0.6.1-dev -> crypto-glue 0.1 -> elliptic-curve
    # 0.13, which only verifies passkey signatures with public keys (and
    # signs with the test authenticator's throwaway keys); every signature
    # the server makes goes through ring. Drop this when webauthn-rs moves
    # to crypto-glue 0.2. Mirrored in .github/workflows/audit.yml.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 verifies passkey signatures with public keys only; no secret operand in production" },
]

[licenses]
version = 2
# The set actually present in the tree. Adding a dependency under another
# licence is a deliberate act: extend this list in the same change.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
# The workspace crates are never published, so their own licence fields
# are not checked.
private = { ignore = true }

[bans]
multiple-versions = "allow"
# No `*` version requirements; the workspace's own path dependencies
# carry none and are fine.
wildcards = "deny"
allow-wildcard-paths = true
# Crates that must not enter the tree go here with the reason.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
